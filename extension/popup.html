<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; } }
  body { margin: 0; width: 280px; font: 13px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: 0; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  #status { color: var(--muted); margin: 0; }
  label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  select { font: inherit; }
</style>
</head>
<body>
  <section>
    <h1>Adaptive Dark Mode</h1>
    <p id="status">…</p>
  </section>
  <section>
    <label>On <span id="host">this site</span>
      <select id="mode">
        <option value="auto">Automatic</option>
        <option value="on">Always</option>
        <option value="off">Never</option>
      </select>
    </label>
  </section>
  <section>
    <label>Enabled everywhere <input type="checkbox" id="enabled"></label>
  </section>
  <script src="popup.js"></script>
</body>
</html>
