name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: npm run lint:syntax
      - name: web-ext lint (Firefox build, warnings are errors)
        run: npm run lint:firefox

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  engine:
    name: Engine (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Engine end-to-end tests
        run: npm run test:engine
        env:
          PW_BROWSER: ${{ matrix.browser }}

  firefox-extension:
    name: Firefox extension (${{ matrix.firefox }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The manifest's strict_min_version, the current ESR, and release.
        firefox: ['140.0esr', latest-esr, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: ${{ matrix.firefox }}
      - run: firefox --version
      - name: Extension end-to-end tests in real Firefox
        run: npm run test:firefox
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [lint, unit, engine, firefox-extension]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:firefox
      - run: npm run package:chrome
      - uses: actions/upload-artifact@v4
        with:
          name: extensions-${{ github.sha }}
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
