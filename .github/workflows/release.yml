name: Release

# Push a tag like v0.2.0 (matching package.json and extension/manifest.json)
# to build, test, sign the Firefox add-on with addons.mozilla.org and publish
# a GitHub release with the signed .xpi and the Chrome zip.
#
# Needs repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (API key and
# secret from https://addons.mozilla.org/developers/addon/api/key/).
# Optional repository variable AMO_CHANNEL: "unlisted" (default; AMO signs it
# for self-distribution and the .xpi is attached to the release) or "listed"
# (submitted to the public AMO listing for review).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: AMO channel
        type: choice
        options: [unlisted, listed]
        default: unlisted

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - uses: browser-actions/setup-firefox@v1
        id: firefox
        with:
          firefox-version: latest
      - run: npm run build
      - run: npm test
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.firefox-path }}

  release:
    name: Sign and publish
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    env:
      CHANNEL: ${{ inputs.channel || vars.AMO_CHANNEL || 'unlisted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check versions match the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          man=$(node -p "require('./extension/manifest.json').version")
          echo "tag=$tag package.json=$pkg manifest=$man"
          test "$tag" = "$pkg" && test "$tag" = "$man"

      - name: Check signing credentials
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -z "$AMO_JWT_ISSUER" ] || [ -z "$AMO_JWT_SECRET" ]; then
            echo "::error::Set the AMO_JWT_ISSUER and AMO_JWT_SECRET repository secrets to sign the Firefox add-on."
            exit 1
          fi

      - name: Build
        run: |
          npm run package:chrome
          npm run build:firefox

      - name: Sign Firefox add-on (${{ env.CHANNEL }})
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          args=(--source-dir dist/firefox --artifacts-dir web-ext-artifacts --channel "$CHANNEL")
          if [ "$CHANNEL" = listed ]; then
            # Listed versions go through AMO review; don't wait for it.
            args+=(--amo-metadata amo-metadata.json --approval-timeout 0)
          fi
          npx web-ext sign "${args[@]}"
          ls -l web-ext-artifacts

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            web-ext-artifacts/*.xpi web-ext-artifacts/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: web-ext-artifacts/*
